<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mengarahkan...</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:system-ui,sans-serif;
background:#ffffff;
color:#333;
}

.container{
text-align:center;
}

.loader{
width:40px;
height:40px;
border:3px solid #eee;
border-top-color:#000;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto;
margin-bottom:15px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

small{
color:#777;
}

</style>

</head>

<body>

<div class="container">

<div class="loader"></div>

<h3>Mengarahkan...</h3>

<small>Mohon tunggu sebentar</small>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzq2D8ln6CG1qfu0wwLDbPaUohL1X6l--HNUAXN3lacTeNzEOxgFYBrxtste6LsAdKN/exec";

const code =
new URLSearchParams(location.search)
.get("c");

if(!code){

document.body.innerHTML =
"<h2>Link tidak valid</h2>";

}else{

fetch(
`${API}?code=${encodeURIComponent(code)}`
)

.then(r=>r.json())

.then(data=>{

if(data.success){

location.replace(data.url);

}else{

document.body.innerHTML =
"<h2>Link tidak ditemukan</h2>";

}

})

.catch(()=>{

document.body.innerHTML =
"<h2>Terjadi kesalahan</h2>";

});

}

</script>

</body>
</html>
