<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short Link Generator</title>

<style>
body{
font-family:system-ui,sans-serif;
max-width:600px;
margin:auto;
padding:30px;
}

h1{
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
}

#result{
margin-top:20px;
word-break:break-all;
}
</style>
</head>
<body>

<h1>Short Link Generator</h1>

<input
id="url"
placeholder="https://example.com">

<input
id="code"
placeholder="Custom nama">

<button onclick="generate()">
Generate
</button>

<div id="result"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzq2D8ln6CG1qfu0wwLDbPaUohL1X6l--HNUAXN3lacTeNzEOxgFYBrxtste6LsAdKN/exec";

async function generate(){

const url =
document.getElementById("url").value.trim();

const code =
document.getElementById("code").value.trim();

if(!url || !code){
alert("Lengkapi data terlebih dahulu");
return;
}

const res = await fetch(API,{
method:"POST",
body:JSON.stringify({
url,
code
})
});

const data = await res.json();

if(data.success){

const shortUrl =
`${location.origin}${location.pathname.replace("index.html","")}go.html?c=${code}`;

document.getElementById("result").innerHTML =
`
<p><b>Berhasil dibuat</b></p>
<a href="${shortUrl}" target="_blank">${shortUrl}</a>
`;

}else{

alert(data.message);

}

}

</script>

</body>
</html>
