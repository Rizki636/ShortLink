<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mengarahkan...</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:system-ui,sans-serif;
background:#fff;
}

.container{
text-align:center;
padding:20px;
}

.loader{
width:42px;
height:42px;
margin:auto;
margin-bottom:15px;
border:3px solid #eee;
border-top:3px solid #111;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

small{
color:#666;
}

</style>

</head>
<body>

<div class="container">

<div class="loader"></div>

<h3>Mengarahkan...</h3>

<small>Mohon tunggu sebentar</small>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbyaCy5gQEFrQRV_oStnW-cVpthxtT4qqUk_00zbUDgCs7deTJNeDOcNaLM1lBzaz4Fp/exec";

const code =
new URLSearchParams(location.search)
.get("c");

if(!code){

document.body.innerHTML = `
<div class="container">
<h2>Link tidak valid</h2>
</div>
`;

}else{

fetch(
`${API}?code=${encodeURIComponent(code)}`
)

.then(r=>r.json())

.then(data=>{

if(data.success){

location.replace(data.url);

}else{

document.body.innerHTML = `
<div class="container">
<h2>Link tidak ditemukan</h2>
</div>
`;

}

})

.catch(()=>{

document.body.innerHTML = `
<div class="container">
<h2>Terjadi kesalahan</h2>
</div>
`;

});

}

</script>

</body>
</html>
