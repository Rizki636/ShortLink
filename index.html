<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Short Link Generator</title>

<style>

body{
font-family:sans-serif;
max-width:500px;
margin:auto;
padding:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
cursor:pointer;
}

.result{
margin-top:20px;
word-break:break-all;
}

</style>
</head>

<body>

<h2>Short Link Generator</h2>

<input
id="url"
placeholder="https://example.com">

<input
id="code"
placeholder="custom nama">

<button onclick="generate()">
Generate
</button>

<div
class="result"
id="result">
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzq2D8ln6CG1qfu0wwLDbPaUohL1X6l--HNUAXN3lacTeNzEOxgFYBrxtste6LsAdKN/exec";

async function generate(){

const url =
document.getElementById("url").value;

const code =
document.getElementById("code").value;

const res =
await fetch(API_URL,{
method:"POST",
body:JSON.stringify({
url,
code
})
});

const data =
await res.json();

if(data.success){

const shortUrl =
`${location.origin}${location.pathname}?code=${code}`;

document.getElementById(
"result"
).innerHTML =

`
<b>Berhasil dibuat</b>
<br><br>
<a href="${shortUrl}">
${shortUrl}
</a>
`;

}else{

alert(data.message);

}

}

const params =
new URLSearchParams(
location.search
);

const code =
params.get("code");

if(code){

fetch(
`${API_URL}?code=${code}`
)

.then(r=>r.json())

.then(data=>{

if(data.success){

location.replace(
data.url
);

}

});

}

</script>

</body>
</html>
