<script>
(function(){
var fallback="https://www.youtube.com/live/bicS9EyXDys?si=7FqPL2zeBoMy29ia";
var api="https://script.google.com/macros/s/AKfycbyaCy5gQEFrQRV_oStnW-cVpthxtT4qqUk_00zbUDgCs7deTJNeDOcNaLM1lBzaz4Fp/exec?code=Euluehhh";
var done=false;
function go(u){if(done)return;done=true;location.replace(u);}
var t=setTimeout(function(){go(fallback);},5000);
fetch(api).then(function(r){return r.json();}).then(function(d){
clearTimeout(t);
go(d&&d.success&&String(d.url).indexOf("http")===0?d.url:fallback);
}).catch(function(){clearTimeout(t);go(fallback);});
})();
</script>
