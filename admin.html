<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Short Link Generator</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:system-ui,sans-serif;
}

body{
max-width:650px;
margin:auto;
padding:30px 20px;
}

h1{
margin-bottom:25px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
padding:12px;
margin-bottom:18px;
border:1px solid #ddd;
border-radius:8px;
outline:none;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

button:hover{
opacity:.9;
}

#result{
margin-top:20px;
padding:15px;
border-radius:8px;
display:none;
word-break:break-all;
}

.success{
background:#f5f5f5;
}

a{
text-decoration:none;
}

</style>

</head>
<body>

<h1>Short Link Generator</h1>

<label>Link Panjang</label>

<input
id="url"
type="url"
placeholder="https://example.com">

<label>Custom Nama</label>

<input
id="code"
type="text"
placeholder="Contoh: Youtube">

<button onclick="generate()">
Generate
</button>

<div id="result"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzq2D8ln6CG1qfu0wwLDbPaUohL1X6l--HNUAXN3lacTeNzEOxgFYBrxtste6LsAdKN/exec";

async function generate(){

const url =
document.getElementById("url").value.trim();

const code =
document.getElementById("code").value.trim();

if(!url || !code){

alert("Lengkapi data terlebih dahulu");
return;

}

try{

const response = await fetch(API,{
method:"POST",
body:JSON.stringify({
url,
code
})
});

const data =
await response.json();

if(data.success){

const shortUrl =
`${location.origin}${location.pathname.replace("admin.html","")}?c=${encodeURIComponent(code)}`;

const result =
document.getElementById("result");

result.style.display = "block";
result.className = "success";

result.innerHTML = `
<b>Berhasil dibuat</b>
<br><br>
<a href="${shortUrl}" target="_blank">
${shortUrl}
</a>
`;

}else{

alert(data.message);

}

}catch{

alert("Gagal terhubung ke server");

}

}

</script>

</body>
</html>
