<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Short Link Generator</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:system-ui,sans-serif;
}

body{
max-width:650px;
margin:auto;
padding:30px 20px;
}

h1{
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
}

#generateBtn{
width:100%;
}

#result{
display:none;
margin-top:20px;
padding:15px;
background:#f5f5f5;
border-radius:8px;
word-break:break-all;
}

#copyBtn{
margin-top:12px;
width:100%;
}

a{
text-decoration:none;
}

</style>

</head>
<body>

<h1>Short Link Generator</h1>

<input
id="url"
type="url"
placeholder="https://example.com">

<input
id="code"
type="text"
placeholder="Custom nama">

<button
id="generateBtn"
onclick="generate()">
Generate
</button>

<div id="result"></div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbyaCy5gQEFrQRV_oStnW-cVpthxtT4qqUk_00zbUDgCs7deTJNeDOcNaLM1lBzaz4Fp/exec";

let generatedLink = "";

async function generate(){

const url =
document.getElementById("url").value.trim();

const code =
document.getElementById("code").value.trim();

if(!url || !code){

alert("Lengkapi data terlebih dahulu");
return;

}

try{

const response =
await fetch(API,{
method:"POST",
body:JSON.stringify({
url,
code
})
});

const data =
await response.json();

if(data.success){

generatedLink =
data.shortUrl;

const result =
document.getElementById("result");

result.style.display =
"block";

result.innerHTML = `

<b>✅ Berhasil dibuat</b>

<br><br>

<a href="${generatedLink}"
target="_blank">

${generatedLink}

</a>

<br><br>

<button
id="copyBtn"
onclick="copyLink()">

Salin Link

</button>

`;

document.getElementById("url").value="";
document.getElementById("code").value="";

}else{

alert(data.message);

}

}catch{

alert("Gagal terhubung ke server");

}

}

function copyLink(){

navigator.clipboard
.writeText(generatedLink);

const btn =
document.getElementById("copyBtn");

btn.innerText =
"Tersalin ✓";

setTimeout(()=>{

btn.innerText =
"Salin Link";

},2000);

}

</script>

</body>
</html>
